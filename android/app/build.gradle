plugins {
    id 'com.android.application'
}

// Assinatura de release: keystore.properties (fora do git) aponta pro .jks. Sem ele, o
// release sai sem assinatura e so o debug instala. A MESMA chave tem que assinar todas as
// versoes, senao o Android recusa instalar a atualizacao por cima.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'br.com.pokedream.pokedreamgrid'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.pokedream.pokedreamgrid'
        minSdk 26
        targetSdk 35
        // o verificador de atualizacao compara versionCode com o numero no nome do APK da Release
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { v ->
        v.outputs.all { outputFileName = "PokeDreamGrid-android-${v.versionCode}${v.buildType.name == 'debug' ? '-debug' : ''}.apk" }
    }
}

dependencies {
    // so pela API de perfis do WebView (MULTI_PROFILE): cookies/localStorage separados por conta,
    // como as particoes persist:contaN do PC. 1.12 e a ultima que compila com compileSdk 35.
    implementation 'androidx.webkit:webkit:1.12.1'
}
